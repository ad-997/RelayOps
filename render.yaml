# Free web service + external Neon Free Postgres. No paid disks/resources.
services:
  - type: web
    name: relayops-ad-997
    runtime: docker
    plan: free
    healthCheckPath: /api/healthz
    envVars:
      - key: RELAY_ENV
        value: production
      - key: RELAY_DB
        sync: false
      - key: RELAY_SECRET
        generateValue: true
      - key: RELAY_API_KEY
        generateValue: true
      - key: RELAY_DEMO_RECEIVERS
        value: "true"
      - key: RELAY_DESTINATIONS
        value: "{}"
