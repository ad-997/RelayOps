services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: relayops
      MYSQL_USER: relay
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 30
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      RELAY_DB: mysql+pymysql://relay:${MYSQL_PASSWORD}@mysql:3306/relayops
      RELAY_RECEIVER_BASE: http://worker:8082
      RELAY_SECRET: ${RELAY_SECRET:?Set RELAY_SECRET in .env}
      RELAY_API_KEY: ${RELAY_API_KEY:?Set RELAY_API_KEY in .env}
    depends_on:
      mysql:
        condition: service_healthy
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    environment:
      RELAY_WORKER_URL: http://worker:8082
      RELAY_API_KEY: ${RELAY_API_KEY}
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      - worker
volumes:
  mysql-data:
